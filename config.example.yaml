# 教学视频内容提取与总结工具 - 配置模板
# 复制此文件为 config.yaml，填入实际的 API Key
# config.yaml 已加入 .gitignore，不会提交到 GitHub

video:
  frame_interval: 30
  frame_format: jpg
  frame_quality: 90

llm:
  max_retries: 3
  timeout: 120

  # 模型注册表：所有可用的模型在此注册
  # capabilities 可选值：text（文本生成）、reasoning（深度推理）、vision（多模态视觉）
  models:
    - name: doubao-seed-2-1-pro-260628
      provider: volcengine
      capabilities: [text, reasoning]
      context_length: 256000
      max_output: 16384
    - name: deepseek-chat
      provider: deepseek
      capabilities: [text]
      context_length: 131072
      max_output: 8192

  # 服务商配置
  # litellm_prefix: LiteLLM 提供商前缀，OpenAI 兼容接口统一用 "openai"
  providers:
    volcengine:
      base_url: "https://ark.cn-beijing.volces.com/api/v3"
      api_key: ""  # 在火山引擎方舟控制台创建
      litellm_prefix: "openai"
    deepseek:
      base_url: "https://api.deepseek.com"
      api_key: ""  # 在 DeepSeek 平台创建
      litellm_prefix: "openai"

# 任务-模型映射：每个任务指定使用的模型和 temperature
# AGENTS.md 约定：一次 LLM 调用返回三样东西（纠错全文+知识点段+题目段），
#   asr_correct_and_extract 合并了原 asr_correction + knowledge_extraction + problem_extraction 的提取调用
# temperature 说明：
#   0.1 - ASR纠错+知识点段+题目段一次性提取，需要准确性
#   0.0 - 题目原题提取（基于题目段+OCR），输出最确定
#   0.2 - 解题过程整理，适度灵活
#   0.3 - 知识点总结、思维导图，需要一定创造性
tasks:
  asr_correct_and_extract:
    model: doubao-seed-2-1-pro-260628
    temperature: 0.1
  problem_extraction:
    model: doubao-seed-2-1-pro-260628
    temperature: 0.0
  mindmap_generation:
    model: doubao-seed-2-1-pro-260628
    temperature: 0.3
  knowledge_summary:
    model: doubao-seed-2-1-pro-260628
    temperature: 0.3
  solution_summary:
    model: doubao-seed-2-1-pro-260628
    temperature: 0.2

asr:
  adapter_type: funasr
  sample_rate: 16000
  channels: 1
  model_name: "paraformer-zh"

frame_dedup:
  algorithm: dhash
  threshold: 0.02
  interval_sec: 1.0

ocr:
  text_adapter_type: paddleocr
  formula_adapter_type: formula_net
  enable_color_filter: false  # P2 可选，PPT 可能用彩色字体分章节
  black_threshold: 120

text_ocr:
  adapter_type: paddleocr
  text_detection_model_name: "PP-OCRv6_small_det"
  text_recognition_model_name: "PP-OCRv6_small_rec"

formula_ocr:
  adapter_type: formula_net
  formula_model_name: "PP-FormulaNet_plus-M"

output:
  transcript_filename: "01_逐字稿.md"
  knowledge_filename: "02_知识点清单.md"
  mindmap_filename: "03_思维导图.opml"
  problems_dirname: "习题"
  screenshots_dirname: "截图"
  timestamp_format: "mm:ss"

paths:
  cache_dir: "./cache"
  output_dir: "./output"
  debug_dir: "./debug"
  temp_dir: "./temp"
  log_dir: "./logs"

cache:
  cache_ocr_frames: true
  max_cache_size_gb: 400
