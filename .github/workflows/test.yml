name: unit-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          # CI 不装 GPU 版 torch/paddle/funasr（unit test 全用 mock，不依赖真实后端）
          # 仅装运行测试所需的最小依赖：PyYAML(config) + numpy/opencv(frame_dedup) + litellm(LLM session import 链)
          pip install pytest pytest-cov PyYAML numpy opencv-contrib-python pillow litellm tqdm psutil

      - name: Run tests
        run: |
          pytest tests/ --cov=. --cov-report=term --cov-report=xml --cov-config=.coveragerc

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
